<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"VT323";src:url(../../../../dedalo/interfaz/fuentes/vt323.woff2) format("woff2")}
@font-face{font-family:"Share Tech Mono";src:url(../../../../dedalo/interfaz/fuentes/share-tech-mono.woff2) format("woff2")}
:root{--negro:#050505;--tiza:#ececec;--regolito:#8d8d8d;--claro:#b4b4b4;--linea:#2c2c2c;--aurora:#ff6b9a;--hilo:#cf84e6;--ambar:#f2b33d;--olivo:#a9d18e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--negro);color:var(--tiza)}
.pix{font-family:"VT323",monospace}.mono{font-family:"Share Tech Mono",monospace;text-transform:uppercase;letter-spacing:.08em}
.sans{font-family:"Inter","Inter Display",sans-serif}
#fondo{position:absolute;inset:0}
.esc{position:absolute;inset:0;display:none}
.rosa{color:var(--aurora)}.ambar{color:var(--ambar)}.hilo{color:var(--hilo)}.reg{color:var(--regolito)}.olivo{color:var(--olivo)}
/* tarjetas de texto */
.tarj .tel{position:absolute;left:150px;top:150px;font-size:28px;color:var(--regolito)}
.tarj .tit{position:absolute;left:144px;top:215px;right:120px;font-size:150px;line-height:.95;letter-spacing:.02em}
.tarj .sub{position:absolute;left:150px;top:640px;width:1400px;font-size:50px;line-height:1.3;font-weight:500;color:#fff}
.tarj .barra{position:absolute;left:150px;top:600px;width:120px;height:4px;background:var(--tiza)}
/* portada y cierre */
.caja{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:var(--negro);padding:34px 90px 44px;box-shadow:0 0 0 1px var(--linea);white-space:nowrap}
.caja .marca{font-size:270px;line-height:.86;letter-spacing:.04em}
.caja .frase{font-size:58px;font-weight:600;color:#fff;margin-top:14px}
.caja .tel{font-size:26px;color:var(--regolito);margin-top:26px}
/* pasos */
.paso .tel{position:absolute;left:50px;top:28px;font-size:26px;color:var(--regolito)}
.paso .tit{position:absolute;left:46px;top:60px;font-size:92px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.paso .sub{position:absolute;left:50px;top:166px;width:1800px;font-size:38px;line-height:1.25;font-weight:500;color:#fff}
.rot{position:absolute;top:262px;font-size:22px;color:var(--regolito)}
.vp{position:absolute;left:50px;top:296px;width:960px;height:651px;overflow:hidden;box-shadow:0 0 0 1px var(--linea);background:#f3f4f8}
.vh{position:absolute;left:1050px;top:296px;width:820px;height:554px;overflow:hidden;box-shadow:0 0 0 1px var(--linea);background:#000}
.vp img{position:absolute;left:0;top:0;width:960px;height:651px;display:none}
.vh img{position:absolute;left:0;top:0;width:820px;height:554px;display:none}
.marco{position:absolute;box-shadow:0 0 0 4px var(--aurora), 0 0 0 9999px rgba(10,10,20,.28);border-radius:4px;display:none}
.argos{position:absolute;left:1050px;top:866px;width:820px}
.argos .k{font-size:22px;color:var(--regolito)}
.niv{display:flex;gap:10px;margin-top:8px}
.niv span{flex:1;text-align:center;font-size:36px;padding:5px 0 7px;box-shadow:inset 0 0 0 1px var(--linea);color:#5a5a5a;letter-spacing:.03em}
.niv span.on{background:var(--tiza);color:#050505;box-shadow:none}
.niv span.on.a{background:var(--ambar)}.niv span.on.r{background:var(--aurora)}
.resp{position:absolute;left:1050px;top:968px;width:820px}
.resp .k{font-size:22px;color:var(--regolito)}
.resp .v{font-size:60px;line-height:1;margin-top:4px;letter-spacing:.03em}
/* registro */
#sT .vg{position:absolute;left:50px;top:296px;width:1010px;height:360px;overflow:hidden;box-shadow:0 0 0 1px var(--linea)}
#sT .vg img{width:1010px;height:360px;display:block}
#sT .argos{left:50px;top:700px;width:1010px}
#sR .vg{position:absolute;left:50px;top:296px;width:1010px;height:780px;overflow:hidden;box-shadow:0 0 0 1px var(--linea)}
#sR .vg img{width:1010px;height:780px;display:block}
#sT ul,#sR ul{position:absolute;left:1110px;top:300px;width:760px;list-style:none}
#sT li,#sR li{font-size:36px;line-height:1.25;font-weight:500;color:#fff;margin-bottom:34px;padding-left:34px;position:relative}
#sT li:before,#sR li:before{content:"";position:absolute;left:0;top:14px;width:16px;height:16px}
#sT li:before{background:var(--olivo)}#sR li.l1:before{background:var(--tiza)}#sR li.l2:before{background:var(--ambar)}#sR li.l3:before{background:var(--aurora)}#sR li.l4:before{background:var(--hilo)}
/* cifras */
#sS .tel,#sL .tel{position:absolute;left:100px;top:56px;font-size:26px;color:var(--regolito)}
#sS .tit,#sL .tit{position:absolute;left:95px;top:88px;font-size:104px;letter-spacing:.02em;white-space:nowrap}
.med{position:absolute;left:100px;width:1720px;border-top:1px solid var(--linea);padding-top:16px}
.med .q{font-family:"Inter";font-size:38px;font-weight:500;color:#fff}
.med .r{display:flex;align-items:center;gap:26px;margin-top:10px}
.med .r b{font-family:"VT323";font-weight:400;font-size:84px;line-height:.9;width:270px;letter-spacing:.02em}
.med .r i{display:block;height:26px;background:var(--tiza)}
.med .r i.v{box-shadow:inset 0 0 0 2px var(--regolito);background:none}
.med .r span{white-space:nowrap;font-family:"Share Tech Mono";text-transform:uppercase;letter-spacing:.08em;font-size:24px;color:var(--claro)}
#sS .pie,#sL .pie{position:absolute;left:100px;top:1010px;font-size:24px;color:var(--regolito)}
#sL ul{position:absolute;left:100px;top:250px;width:1720px;list-style:none}
#sL li{display:flex;gap:40px;align-items:baseline;border-top:1px solid var(--linea);padding:20px 0 22px}
#sL li b{font-family:"VT323";font-weight:400;font-size:84px;line-height:.9;width:330px;flex:none;letter-spacing:.02em}
#sL li span{font-family:"Inter";font-size:38px;font-weight:500;color:#fff;line-height:1.25}
/* resumen */
#sZ .tel{position:absolute;left:150px;top:70px;font-size:28px;color:var(--regolito)}
#sZ .tit{position:absolute;left:144px;top:105px;font-size:110px;letter-spacing:.02em}
.fila{position:absolute;left:150px;width:1650px;display:flex;align-items:baseline;gap:40px;border-top:1px solid var(--linea);padding-top:14px}
.fila b{font-family:"VT323";font-weight:400;font-size:84px;width:430px;letter-spacing:.03em;line-height:1}
.fila span{font-family:"Inter";font-size:40px;font-weight:500;color:#fff}
.esc{display:block}
.paso .tit{font-size:84px}
.sello{position:absolute;right:50px;top:40px;font-family:"VT323";font-size:60px;line-height:1;padding:10px 22px 14px;letter-spacing:.03em}
.sello.real{background:var(--tiza);color:#050505}.sello.lab{background:var(--hilo);color:#050505}.sello.cebo{background:var(--aurora);color:#050505}
.cuenta{position:absolute;left:1050px;top:962px;width:820px;display:flex;gap:16px}
.cuenta div{flex:1;box-shadow:inset 0 0 0 1px var(--linea);padding:8px 16px 10px}
.cuenta .k{font-family:"Share Tech Mono";text-transform:uppercase;letter-spacing:.08em;font-size:20px;color:var(--regolito)}
.cuenta .v{font-family:"VT323";font-size:76px;line-height:.9}
.vp img,.vh img{display:block}
</style></head><body>
<section class="esc paso">
<div class="tel mono" id="tel"></div><div class="tit pix" id="tit"></div><div class="sub sans" id="sub"></div>
<div class="sello" id="sello"></div>
<div class="rot mono" style="left:50px">uso de la aplicación · lo que ve el atacante</div>
<div class="rot mono" style="left:1050px">lo que pasa detrás · el registro</div>
<div class="vp"><img id="ip"></div><div class="vh"><img id="ih"></div>
<div class="argos"><div class="k mono">argos · cómo clasifica a esta cuenta</div><div class="niv pix"><span id="n0">NORMAL</span><span id="n1">OBSERVADO</span><span id="n2">SOSPECHOSO</span><span id="n3">CONFIRMADO</span></div></div>
<div class="cuenta"><div><div class="k">llegaron al sistema real</div><div class="v" id="cr"></div></div><div><div class="k">las respondió el laberinto</div><div class="v hilo" id="cl"></div></div></div>
</section>
<script>
const P=[
["POST /api/login → 200","Entra con una cuenta válida de contratista.","real",0],
["GET /api/archivos → 200","Ve sus seis documentos. Nada raro todavía.","real",0],
["GET /api/archivos/6 → 404","Pide un archivo ajeno. Los permisos se lo niegan y ARGOS lo anota.","real",1],
["GET /api/admin/usuarios → 403","Intenta entrar a administración. Segunda señal: sospechoso.","real",2],
["GET /api/buscar?q=planos represa → 200","Busca planos. Solo a él le aparece un archivo que no existe: el cebo.","real",2],
["GET /api/archivos/9834 → 200","Abre el cebo. Ícaro desvía su cuenta entera.","cebo",3],
["GET /api/archivos → 200","Lista archivos: ya son falsos. El portal se ve igual.","lab",3],
["POST /api/login → 200","Vuelve a iniciar sesión con su contraseña: sigue adentro.","lab",3],
["GET /api/archivos/6 → 200","El archivo que antes le negaron ahora «abre». Es falso.","lab",3],
["GET /api/buscar?q=represa → 200","Busca otra vez: resultados que no existen.","lab",3],
["GET /api/perfil → 200","Hasta su perfil lo sirve el laberinto.","lab",3],
];
function poner(k){
  const fin=k===11, i=fin?10:k, p=P[i], $=x=>document.getElementById(x);
  $("tel").textContent=fin?"demo en bucle · resultado · vuelve a empezar":`demo en bucle · atacante de guion · solicitud ${i+1} de 11`;
  $("tit").textContent=fin?"DESPUÉS DE DETECTARLO: 0 AL SISTEMA REAL":p[0];
  $("sub").textContent=fin?"Cinco solicitudes llegaron antes de que mordiera. Las cinco siguientes las respondió el laberinto.":p[1];
  const s=$("sello"); s.className="sello "+(fin?"lab":p[2]); s.textContent=fin?"CONTENIDO":({real:"LLEGA AL SISTEMA REAL",cebo:"ES EL CEBO",lab:"NO LLEGA · LABERINTO"})[p[2]];
  $("ip").src=`rec/m_portal_${i+1}.jpg`; $("ih").src=`rec/m_hilo_${i+1}.jpg`;
  for(let n=0;n<4;n++) $("n"+n).className=n===p[3]?"on"+(n===1||n===2?" a":n===3?" r":""):"";
  $("cr").textContent=Math.min(i+1,5); $("cl").textContent=Math.max(0,i-5);
  return Promise.all([$("ip").decode(),$("ih").decode()]);
}
</script></body></html>
